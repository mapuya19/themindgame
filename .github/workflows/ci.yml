name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:worker
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm audit --prefix worker --omit=dev
